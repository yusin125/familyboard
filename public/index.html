<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>패밀리보드 - 가족 주간 스케줄러</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-title">🏡 패밀리보드</span>
      <span class="brand-sub">바이브 Go</span>
    </div>

    <div class="week-nav">
      <button id="prevWeekBtn" class="nav-btn" title="이전 주">◀</button>
      <div class="week-label" id="weekLabel">-</div>
      <button id="nextWeekBtn" class="nav-btn" title="다음 주">▶</button>
      <button id="todayBtn" class="pill-btn">오늘로 이동</button>
    </div>

    <div class="view-toggle viewer-only" id="viewToggle">
      <button type="button" id="viewGridBtn" class="view-toggle-btn active">📋 시간표로 보기</button>
      <button type="button" id="viewCalendarBtn" class="view-toggle-btn">📅 달력으로 보기</button>
    </div>

    <div class="mode-area">
      <button type="button" id="musicToggleBtn" class="pill-btn music-btn" title="배경음악 켜기/끄기">🎵 음악 켜기</button>
      <button type="button" id="modeToggleBtn" class="mode-toggle-btn" title="클릭해서 관리자 모드/뷰어 모드 전환">관리자 모드</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="card mini-cal">
        <div class="mini-cal-header">
          <button id="miniPrevMonth" class="nav-btn small">◀</button>
          <div id="miniMonthLabel" class="mini-month-label">-</div>
          <button id="miniNextMonth" class="nav-btn small">▶</button>
        </div>
        <div class="mini-cal-weekdays">
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span><span class="sun">일</span>
        </div>
        <div id="miniCalGrid" class="mini-cal-grid"></div>
      </div>

      <div class="card member-filter">
        <div class="card-title">구성원 보기</div>
        <div id="memberFilterList" class="member-filter-list"></div>
        <button id="manageMembersBtn" class="text-btn admin-only">+ 구성원 관리</button>
      </div>

      <button type="button" id="manageRecurringBtn" class="sidebar-action-btn admin-only">🔁 반복 일정 관리</button>

      <div class="card memo-board">
        <div class="card-title">가족 메모보드</div>
        <div id="memoList" class="memo-list"></div>
        <form id="memoForm" class="memo-form">
          <div class="memo-member-select-wrap">
            <button type="button" id="memoMemberBtn" class="memo-dot-btn" title="작성자 선택"></button>
            <div id="memoMemberDropdown" class="memo-member-dropdown hidden"></div>
          </div>
          <input type="text" id="memoText" maxlength="200" placeholder="메모를 남겨보세요" required />
          <button type="submit" class="memo-send-btn" title="등록">➤</button>
        </form>
      </div>
    </aside>

    <button type="button" id="sidebarToggleBtn" class="sidebar-toggle-btn" title="사이드바 접기/펼치기">《</button>

    <main class="board-area">
      <div class="board-scroll" id="boardScroll">
        <div class="board" id="board">
          <div class="board-header" id="boardHeader"></div>
          <div class="board-body" id="boardBody"></div>
        </div>
      </div>
      <div class="calendar-scroll hidden" id="calendarScroll">
        <button type="button" id="calPrevBtn" class="cal-nav-arrow" title="이전 주">◀</button>
        <div class="calendar-view-wrap">
          <div class="calendar-view" id="calendarView"></div>
        </div>
        <button type="button" id="calNextBtn" class="cal-nav-arrow" title="다음 주">▶</button>
      </div>
    </main>
  </div>
</div>

<!-- 일정 등록/수정 모달 -->
<div id="scheduleModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2 id="scheduleModalTitle">일정 등록</h2>
    <form id="scheduleForm">
      <label>구성원
        <select id="fMember" required></select>
      </label>
      <label>날짜
        <input type="date" id="fDate" required />
      </label>
      <div class="time-row">
        <label>시작 시간
          <select id="fStart" required></select>
        </label>
        <label>종료 시간
          <select id="fEnd" required></select>
        </label>
      </div>
      <p class="time-hint">그리드에서 시작 칸을 클릭하고(또는 드래그해서) 종료 칸을 클릭하면 시간이 자동으로 채워져요.</p>
      <label>일정 내용
        <input type="text" id="fTitle" maxlength="40" required placeholder="예: 축구 클럽" />
      </label>
      <label>메모 (선택)
        <textarea id="fMemo" maxlength="200" rows="2" placeholder="예: 준비물 챙기기"></textarea>
      </label>
      <p class="form-error" id="scheduleFormError"></p>
      <div class="modal-actions">
        <button type="button" id="deleteScheduleBtn" class="danger-btn hidden">삭제</button>
        <div class="spacer"></div>
        <button type="button" id="cancelScheduleBtn" class="ghost-btn">취소</button>
        <button type="submit" class="primary-btn">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 구성원 관리 모달 -->
<div id="memberModal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>구성원 관리</h2>
    <div id="memberManageList" class="member-manage-list"></div>
    <form id="addMemberForm" class="add-member-form">
      <input type="text" id="newMemberName" maxlength="10" placeholder="새 구성원 이름" required />
      <button type="submit" class="primary-btn">추가</button>
    </form>
    <p class="form-error" id="memberFormError"></p>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button type="button" id="closeMemberModalBtn" class="ghost-btn">닫기</button>
    </div>
  </div>
</div>

<!-- 반복 일정 관리 모달 -->
<div id="recurringModal" class="modal-backdrop hidden">
  <div class="modal recurring-modal">
    <h2>반복 일정 관리</h2>
    <form id="recurringForm">
      <label>구성원
        <select id="rMember" required></select>
      </label>
      <label>일정 제목
        <input type="text" id="rTitle" maxlength="40" required placeholder="예: 태권도 학원" />
      </label>
      <label>반복 요일
        <div id="rDaysOfWeek" class="days-of-week-picker"></div>
      </label>
      <div class="time-row">
        <label>시작 날짜
          <input type="date" id="rStartDate" required />
        </label>
        <label>종료 날짜
          <input type="date" id="rEndDate" required />
        </label>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="rNoEnd" /> 종료 없음 (무기한)
      </label>
      <div class="time-row">
        <label>시작 시간
          <select id="rStart" required></select>
        </label>
        <label>종료 시간
          <select id="rEnd" required></select>
        </label>
      </div>
      <p class="form-error" id="recurringFormError"></p>
      <div class="modal-actions">
        <button type="button" id="cancelRecurringEditBtn" class="ghost-btn hidden">수정 취소</button>
        <div class="spacer"></div>
        <button type="submit" class="primary-btn" id="recurringSubmitBtn">추가</button>
      </div>
    </form>

    <hr class="modal-divider" />

    <div id="recurringList" class="recurring-list"></div>

    <div class="modal-actions">
      <div class="spacer"></div>
      <button type="button" id="closeRecurringModalBtn" class="ghost-btn">닫기</button>
    </div>
  </div>
</div>

<script src="holidays.js"></script>
<script src="music.js"></script>
<script src="app.js"></script>
</body>
</html>
